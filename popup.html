<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="head">
    <button type="button" class="pig-btn" id="pig-toggle" aria-pressed="false" aria-label="Pause filtering"></button>
    <span class="wm">Slop Filter</span>
    <span class="lbl" id="status" role="status">Watching your feed</span>
  </header>

  <section class="sec">
    <h2>When a post is flagged</h2>
    <div class="seg" role="radiogroup" aria-label="When a post is flagged">
      <label class="seg-opt"><input type="radio" name="flagmode" value="collapse"><span>Collapse it</span></label>
      <label class="seg-opt"><input type="radio" name="flagmode" value="label"><span>Show with a notice</span></label>
    </div>
    <p class="hint" id="flag-hint"></p>
  </section>

  <section class="sec"><h2>Filters</h2><div id="filters"></div></section>
  <section class="sec"><h2>Muted</h2><div id="mutes"></div></section>

  <footer class="foot">
    <span class="ver" id="version"></span>
    <span class="links">
      <button type="button" class="link" id="pause-link">Pause filtering</button>
      <button type="button" class="link" id="open-settings">Open Settings</button>
    </span>
  </footer>

  <script src="filters.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body></html>
